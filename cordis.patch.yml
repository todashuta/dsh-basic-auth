# dsh-basic-authのbundle patch。`dsh plugin add`でインストールされ、
# profile bundleとして選ばれる
#
# 変更は2つ。
#
# 1. `web-runtime`の行がトークン付きURLの表示とブラウザ起動を止める。
#    このプラグインがトークンなしURLを代わりに表示するためだ。patchは対象の行の
#    `config`を丸ごと置き換えるので、その行が持つkeyはopenBrowser、printUrl、
#    publicUrl、surfaceContextの4つで、すべてここに書き直す
#
# 2. プラグインはpackage名でinsertする。`dsh plugin add`はこのpackageを
#    profileのnode_modulesに置くため、Loaderはprofileから名前だけで解決できる。
#    絶対file:// URLにするとチェックアウトに固定され、packageが動いた途端に壊れる

- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    publicUrl: !!js ctx.webStartup.publicUrl
    surfaceContext: true

- insert:
    - id: dsh-basic-auth
      name: dsh-basic-auth
      config:
        username: dsh
        # 未設定か空ならBasic認証を無効にし、DSH本来のトークン方式を
        # そのままにする。変数がなくても構成が弱くならないようにする
        password: !!js process.env.DSH_WEB_PASSWORD
        realm: DeepSeek Harness
